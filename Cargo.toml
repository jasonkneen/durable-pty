[package]
name = "durable-pty"
version = "0.1.0"
edition = "2024"
description = "Durable PTY sessions: a daemon, CLI and MCP server in one binary"
license = "MIT"
readme = "README.md"
keywords = ["pty", "terminal", "daemon", "mcp"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures = "0.3.34"
libc = "0.2.191"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
uuid = { version = "1.28.0", features = ["v4"] }
vt100 = "0.16.2"

[[bin]]
name = "dpty"
path = "src/main.rs"
