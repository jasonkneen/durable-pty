<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Durable PTY">
  <title>Durable PTY</title>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#0d1117"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="#2f3b4a" stroke-width="3"/>
  <!-- the prompt: a heavy chevron that stays put -->
  <path d="M34 40 L62 64 L34 88" fill="none" stroke="#5eead4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the cursor, held inside a ring: the session that keeps running -->
  <rect x="70" y="80" width="26" height="12" rx="3" fill="#e6edf3"/>
  <path d="M104 44 A42 42 0 0 0 40 24" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
</svg>
