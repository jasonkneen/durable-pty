name: release
# Push a tag such as v0.1.1 (scripts/release.sh does this) to build binaries for macOS and Linux, publish them as a GitHub
# release with checksums, and update the Homebrew tap.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -eu
          out="dpty-${{ matrix.target }}"
          mkdir "$out"
          cp "target/${{ matrix.target }}/release/dpty" LICENSE README.md "$out/"
          tar -czf "$out.tar.gz" -C "$out" dpty LICENSE README.md
          if command -v sha256sum >/dev/null; then sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"; else shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dpty-${{ matrix.target }}
          path: dpty-${{ matrix.target }}.tar.gz*
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {f=1; next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d' > notes.md
          [ -s notes.md ] || echo "Durable PTY $v" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
  homebrew:
    # Updates Formula/dpty.rb in the tap. Needs a repository secret TAP_GITHUB_TOKEN: a token with write access to the tap.
    needs: publish
    runs-on: ubuntu-22.04
    env:
      TAP_REPO: jasonkneen/homebrew-tap
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Skip without a tap token
        if: env.TAP_TOKEN == ''
        run: |
          echo "TAP_GITHUB_TOKEN is not set, so update the tap by hand (see RELEASING.md)"
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: env.TAP_TOKEN != ''
        with:
          path: dist
          merge-multiple: true
      - name: Write the formula and push it to the tap
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          private="$(gh api "repos/$GITHUB_REPOSITORY" -q .private)"
          mode=binary; [ "$private" = true ] && mode=source
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          scripts/gen-formula.sh "$GITHUB_REF_NAME" "$mode" dist > tap/Formula/dpty.rb
          cd tap
          git config user.name "dpty release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/dpty.rb
          git diff --cached --quiet || git commit -m "dpty $GITHUB_REF_NAME" && git push
