name: release
# Push a tag such as v0.1.0 to build binaries for macOS and Linux and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -eu
          out="dpty-${{ matrix.target }}"
          mkdir "$out"
          cp "target/${{ matrix.target }}/release/dpty" LICENSE README.md "$out/"
          tar -czf "$out.tar.gz" -C "$out" dpty LICENSE README.md
          if command -v sha256sum >/dev/null; then sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"; else shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dpty-${{ matrix.target }}
          path: dpty-${{ matrix.target }}.tar.gz*
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
